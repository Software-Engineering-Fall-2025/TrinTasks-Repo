name: TrinTasks
options:
  bundleIdPrefix: com.trintasks
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"

targets:
  TrinTasks:
    type: application
    platform: macOS
    sources:
      - path: Sources/TrinTasks
      - path: Sources/TrinTasksApp
    resources:
      - path: Sources/TrinTasksApp/Resources
    info:
      path: Resources/Info.plist
      properties:
        CFBundleName: TrinTasks
        CFBundleIdentifier: com.trintasks.app
        CFBundleVersion: "1"
        CFBundleShortVersionString: "1.0"
        LSUIElement: true
        NSUserNotificationsUsageDescription: "TrinTasks sends reminders for upcoming assignments."
        ATSApplicationFontsPath: "."
    entitlements:
      path: Resources/TrinTasks.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.trintasks.app
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/TrinTasks.entitlements

  TrinTasksTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/TrinTasksTests
    dependencies:
      - target: TrinTasks
    settings:
      base:
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/TrinTasks.app/Contents/MacOS/TrinTasks"
        BUNDLE_LOADER: "$(TEST_HOST)"
